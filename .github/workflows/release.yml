name: release

# 打 tag 就出四平台产物 + GitHub Release（install.sh 从这里取二进制）。
# 这条路不依赖 npm，也不要求任何人的账号 —— 给「没装 Go 也没装 npm」的人用。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: 交叉编译四个平台并打包
        env:
          MODULE: github.com/9Ashwin/flow-one
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${target%%/*}"; GOARCH="${target##*/}"
            ARCH="$GOARCH"; [ "$GOARCH" = "amd64" ] && ARCH="x64"
            echo "→ $GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath \
              -ldflags "-s -w -X $MODULE/internal/build.Version=${GITHUB_REF_NAME} -X $MODULE/internal/build.Date=$(date -u +%Y-%m-%d)" \
              -o dist/flow-one .
            tar -czf "dist/flow-one-$GOOS-$ARCH.tar.gz" -C dist flow-one
            rm dist/flow-one
          done
          # install.sh 放在 release 产物里，于是 .../releases/latest/download/install.sh 永远可用
          cp install.sh dist/install.sh
          ls -l dist

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
