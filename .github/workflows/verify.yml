name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run lint
      - run: node scripts/check-modules.ts
      - run: npm run format:check
      - run: npm test
      - run: npm run build:dist
      - name: Ensure the committed installation snapshot is current
        run: git diff --exit-code -- dist
      - name: Pack and install into an isolated global prefix
        shell: bash
        run: |
          package_file="flow-one-$(node -p "require('./package.json').version").tgz"
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/flow-one-prefix" "$RUNNER_TEMP/$package_file"
      - name: Verify installed command on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$("$RUNNER_TEMP/flow-one-prefix/bin/fo" --version)"
          test "$actual" = "$expected"
          test ! -L "$RUNNER_TEMP/flow-one-prefix/lib/node_modules/flow-one"
      - name: Verify installed command on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = node -p "require('./package.json').version"
          $actual = & "$env:RUNNER_TEMP\flow-one-prefix\fo.cmd" --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Installed fo version mismatch' }
          if ((Get-Item "$env:RUNNER_TEMP\flow-one-prefix\node_modules\flow-one").LinkType) { throw 'Package is a link' }
