name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.20', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # CI 与本地跑同一套门禁（make verify = 语法 + 模块规约 + 全部单测），
      # 免得「本地绿、CI 红」这种差异要靠人去猜。
      - run: make verify
